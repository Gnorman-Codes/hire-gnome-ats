components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
  responses:
    Error:
      description: Request failed
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Error"
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor: {"name":"cursor","in":"query","required":false,"schema":{"type":"string"}}
    UpdatedSince:
      name: updatedSince
      in: query
      required: false
      schema:
        type: string
        format: date-time
    RecordId: {"name":"recordId","in":"path","required":true,"schema":{"$ref":"#/components/schemas/Short"}}
  schemas:
    Short: {"type":"string","minLength":1,"maxLength":191}
    NullableShort: {"type":["string","null"],"maxLength":191}
    Long: {"type":["string","null"],"maxLength":12000}
    Email: {"type":"string","format":"email","maxLength":191}
    Nonnegative: {"type":["number","null"],"minimum":0}
    Page: {"type":"object","required":["nextCursor"],"properties":{"nextCursor":{"type":["string","null"]}}}
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
    Owner:
      type: object
      properties:
        recordId:
          "$ref": "#/components/schemas/Short"
        firstName:
          "$ref": "#/components/schemas/Short"
        lastName:
          "$ref": "#/components/schemas/Short"
    ClientCreate:
      type: object
      required: ["name","zipCode"]
      additionalProperties: false
      properties:
        name: {"$ref":"#/components/schemas/Short"}
        zipCode: {"$ref":"#/components/schemas/Short"}
        industry: {"$ref":"#/components/schemas/NullableShort"}
        phone: {"$ref":"#/components/schemas/NullableShort"}
        address: {"$ref":"#/components/schemas/NullableShort"}
        city: {"$ref":"#/components/schemas/NullableShort"}
        state: {"$ref":"#/components/schemas/NullableShort"}
        website: {"$ref":"#/components/schemas/NullableShort"}
        description: {"$ref":"#/components/schemas/Long"}
        status: {"enum":["Prospect","Active","Active + Verified","Inactive"]}
        customFields: {"type":"object","additionalProperties":true}
        ownerRecordId: {"$ref":"#/components/schemas/Short"}
    ClientUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {"$ref":"#/components/schemas/Short"}
        zipCode: {"$ref":"#/components/schemas/Short"}
        industry: {"$ref":"#/components/schemas/NullableShort"}
        phone: {"$ref":"#/components/schemas/NullableShort"}
        address: {"$ref":"#/components/schemas/NullableShort"}
        city: {"$ref":"#/components/schemas/NullableShort"}
        state: {"$ref":"#/components/schemas/NullableShort"}
        website: {"$ref":"#/components/schemas/NullableShort"}
        description: {"$ref":"#/components/schemas/Long"}
        status: {"enum":["Prospect","Active","Active + Verified","Inactive"]}
        customFields: {"type":"object","additionalProperties":true}
        ownerRecordId: {"$ref":"#/components/schemas/Short"}
    Client:
      type: object
      required:
      - recordId
      - createdAt
      - updatedAt
      - name
      - zipCode
      - industry
      - phone
      - address
      - city
      - state
      - website
      - description
      - status
      - customFields
      - ownerRecordId
      - divisionRecordId
      properties:
        recordId: {"$ref":"#/components/schemas/Short"}
        createdAt: {"type":"string","format":"date-time"}
